name: Build Obsidian plugin ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build plugin
        run: npm run build
      - name: Verify matching versions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const manifest = require('./build/manifest.json');
          const bundle = fs.readFileSync('build/main.js', 'utf8');
          if (pkg.version !== manifest.version || pkg.name !== manifest.id) throw Error('Plugin metadata mismatch');
          if (manifest.isDesktopOnly !== false) throw Error('Android compatibility requires isDesktopOnly=false');
          if (bundle.includes('PNG (text clarity)')) throw Error('Old PNG text clarity interface is still bundled');
          if (!bundle.includes('AGFzbQ')) throw Error('JPEG encoder WebAssembly must be bundled for offline mobile use');
          if (/require\(["'](?:electron|(?:node:)?fs)["']\)/.test(bundle)) throw Error('Desktop-only runtime dependency in plugin bundle');
          NODE
      - name: Prepare installable folder
        id: plugin
        run: |
          echo "version=$(node -p 'require("./manifest.json").version')" >> "$GITHUB_OUTPUT"
          id=$(node -p 'require("./manifest.json").id')
          mkdir -p "package/$id"
          cp build/main.js build/manifest.json build/styles.css "package/$id/"
          cp node_modules/@jsquash/jpeg/LICENSE "package/$id/LICENSE-JSQUASH.txt"
          cp node_modules/@jsquash/jpeg/codec/LICENSE.codec.md "package/$id/LICENSE-JPEG-CODEC.md"
      - name: Upload downloadable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: paste-image-resize-compress-rename-${{ steps.plugin.outputs.version }}-${{ github.run_number }}
          path: package/
          if-no-files-found: error
